name: LaTeX

# What runs, and when:
#   push to any branch  -> build: compile, check references, keep the PDF as an artifact
#   push to main        -> publish: also put the PDF on the "pdf" branch, viewable in the browser
#   pull request        -> diff: "track changes" PDF comparing the PR with its target branch
#   tag such as v1.0    -> release: attach the PDF to a GitHub Release

on:
  push:
    branches: ['**', '!pdf']   # never react to the branch this workflow writes to
    tags: ['v*']
  pull_request:
  workflow_dispatch:           # "Run workflow" button on the Actions page

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# TeX Live image: texlive/texlive:latest (full scheme, current year).
# Keep it identical in the jobs below and in .devcontainer.json.

jobs:
  # The reference build. "It compiles here" is the definition of correct.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile
        run: latexmk

      - name: Fail on undefined references or citations
        run: |
          if grep -E "(Reference|Citation) .* undefined" build/main.log; then
            echo "::error::Undefined references or citations, see the lines above."
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: pdf
          path: build/main.pdf
          retention-days: 30

  # Every successful build of main replaces main.pdf on the "pdf" branch.
  # That branch holds only the PDF (one commit, overwritten each time), so the
  # link https://github.com/OWNER/REPO/blob/pdf/main.pdf always shows the latest version.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pdf
          path: out

      - name: Push the PDF to the pdf branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b pdf
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          git commit -q -m "PDF of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pdf
          echo "### [Open the PDF](https://github.com/${GITHUB_REPOSITORY}/blob/pdf/main.pdf)" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"

  # "Track changes" PDF for reviewers: base branch vs. this pull request.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    continue-on-error: true
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build diff PDF
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash .github/diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/upload-artifact@v6
        with:
          name: diff-pdf
          path: build/diff.pdf
          retention-days: 30

  # Pushing a tag like v1.0 publishes the PDF as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pdf
      - uses: softprops/action-gh-release@v3
        with:
          files: main.pdf
